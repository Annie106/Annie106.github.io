# 自己构建、再交给 GitHub 托管。
#
# 和以前「Pages 直接吃仓库根目录 + Jekyll exclude」的区别：
#   以前 —— GitHub 跑一趟 Jekyll，靠 _config.yml 的 exclude 把开发文件挡在产物外
#   现在 —— 本地/CI 用 tools/build-site.js 生成 dist/，只有 dist/ 会被发出去，
#            GitHub 不参与任何构建决策，只负责托管静态文件
#
# ⚠️ 首次使用前必须在仓库里改一次设置：
#    Settings → Pages → Build and deployment → Source 选「GitHub Actions」
#    这一步没法由代码完成（需要仓库 admin 权限）。
#    没改之前，这个 workflow 的 deploy-pages 会失败，但站点仍由旧的分支发布流程
#    继续提供，不会挂掉。
name: 部署站点

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要这三个权限；contents: read 就够，因为我们只读源码
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署。不取消进行中的那个 —— 中途取消会留下半个产物
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 图标是「按源码里用到的图标裁出来的子集」。贡献者本地不必装 Python：
      # 这里在构建前重新裁一遍，保证产物里的字体和图标用法一致。
      # 如果谁写了一个不存在的图标名，这一步会失败并指出是哪个文件第几行。
      - name: 准备 Python（图标子集用）
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装图标裁剪依赖
        run: pip install fonttools brotli

      - name: 重新生成图标子集
        run: python tools/subset-icons.py

      # 唯一的构建期依赖（esbuild），只给最后那步压缩用。npm ci 严格按 lockfile 装，
      # 不会因为上游发了新版本导致产物悄悄变化。
      - name: 安装构建依赖（压缩用）
        run: npm ci

      # 文章的正文和元信息在 posts/*.md，这一步把它们合成 js/posts-data.js。
      # 仓库里那份是提交过的；这里再跑一次，是为了「只改了 md、忘了重新生成」时也能出正确的站。
      - name: 由 Markdown 生成文章数据
        run: node tools/build-posts-data.js

      - name: 生成发布产物 dist/
        run: node tools/build-site.js

      # 抓每篇文章在 giscus 的真实评论数，写进 dist/js/comment-counts.js。
      # 必须在 build-site.js 之后（要覆盖复制过去的空表占位）、minify 之前。
      # 脚本内部对失败做了兜底（记 0），网络抖一下不会让部署失败。
      - name: 抓真实评论数
        run: node tools/build-comment-counts.js

      # 每篇公开文章烤一份静态页（/posts/<id>/），外加 sitemap.xml 和 robots.txt。
      # 必须在 build-site.js 之后：那一步会清空 dist/。
      - name: 生成文章静态页
        run: node tools/build-posts.js

      # 必须最后跑：前面的步骤会把源码原样复制进 dist/，压早了会被覆盖。
      - name: 压缩 dist/ 里的 JS 和 CSS
        run: node tools/minify.js

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
