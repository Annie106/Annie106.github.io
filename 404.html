<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie · 页面走丢了</title>
    <meta name="robots" content="noindex">

    <!-- 图标必须是站点根路径，不能像别的页面那样写相对地址：
         这一页会被 GitHub Pages 兜到任意路径（/foo/bar）上渲染，
         相对写法会解析成 /foo/bar/favicon.svg，又是一次 404。
         本地 file:// 预览时根路径指到盘符根，所以下面那段脚本会把它改回相对地址。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="faviconLink">

    <!-- 站点已从 /annie106/ 迁到根目录。
         GitHub Pages 不支持服务端重定向，所以历史链接只能靠这里兜。
         命中 /annie106/xxx 时，把前缀剥掉原地替换，查询串和锚点一起带走。 -->
    <script>
        (function () {
            try {
                var m = window.location.pathname.match(/^\/annie106(\/.*)?$/i);
                if (m) {
                    var rest = m[1] || '/';
                    window.location.replace(rest + window.location.search + window.location.hash);
                    return;
                }
            } catch (e) {}

            /* 反馈页 / 评论区已经并进主页面（?view=feedback / ?view=comments），
               原来 project_subpage/blog/ 下的那两个文件也挪进 /archive/ 归档了。
               旧链接打到这两个路径时直接送去新地址，
               老参数 article / title 顺手改名成 fa+ft（反馈）、ca+ct（评论）。 */
            try {
                var legacy = window.location.pathname.match(/\/project_subpage\/blog\/(feedback|comments)\.html$/i);
                if (legacy) {
                    var view = legacy[1].toLowerCase();
                    var old = new URLSearchParams(window.location.search);
                    var next = new URLSearchParams();
                    next.set('view', view);
                    var legacyArticle = old.get('article');
                    var legacyTitle = old.get('title');
                    if (legacyArticle) next.set(view === 'feedback' ? 'fa' : 'ca', legacyArticle);
                    if (legacyTitle) next.set(view === 'feedback' ? 'ft' : 'ct', legacyTitle);
                    window.location.replace('/index.html?' + next.toString());
                    return;
                }
            } catch (e) {}

            try {
                var t = localStorage.getItem('annie-theme');
                var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : (dark ? 'dark' : 'light'));
            } catch (e) {}

            /* head 里的 favicon 用的是站点根路径（这页会被兜到任意路径渲染），
               本地 file:// 打开时根路径会指到盘符根，退回到相对地址。 */
            try {
                if (window.location.protocol === 'file:') {
                    document.getElementById('faviconLink').href = 'favicon.svg';
                }
            } catch (e) {}
        })();
    </script>

    <style>
        :root {
            --bg: #fbfaf7;
            --card: #ffffff;
            --text: #2c2c2a;
            --muted: #7a7873;
            --border: rgba(44, 44, 42, 0.12);
            --accent: #185fa5;
        }
        [data-theme="dark"] {
            --bg: #16161a;
            --card: #1e1e23;
            --text: #ecebe6;
            --muted: #9a988f;
            --border: rgba(236, 235, 230, 0.14);
            --accent: #85b7eb;
        }
        /* 这个页面没有引 css/style.css，所以那条「点按高亮透明」的全局重置得自己写。
           不写的话，手机点「回到首页 / 获取联系」会在圆角按钮外面闪出一块方形的蓝底。 */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 内容整体上移到视线落点（约视口高度的 1/3），不再死板地居中。
               用不对称内边距实现：底部留白远大于顶部，flex 居中算出来的中心就整体上浮。
               短屏时内容居中也不会被裁掉，比写死 padding-top 稳。 */
            padding: 24px 24px clamp(72px, 26vh, 260px);
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 420px; text-align: center; }
        .code {
            font-size: 64px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 2px;
            color: var(--muted);
            opacity: 0.45;
            margin: 0 0 18px;
        }
        h1 { font-size: 19px; font-weight: 500; margin: 0 0 10px; }
        p { font-size: 14px; line-height: 1.75; color: var(--muted); margin: 0 0 26px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        a.btn {
            display: inline-block;
            padding: 9px 20px;
            border-radius: 999px;
            font-size: 14px;
            text-decoration: none;
            border: 1px solid var(--border);
            color: var(--text);
            transition: border-color .2s ease, opacity .2s ease;
        }
        a.btn:hover { border-color: var(--muted); }
        a.btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        [data-theme="dark"] a.btn.primary { color: #10151c; }
        a.btn.primary:hover { opacity: .88; }

        /* ==================== 「获取联系」浮窗 ====================
           内容是 project_subpage/blog/contact.html，装在一个 iframe 里。
           用 iframe 而不是把表单抄进来：那一页自己引了 css/style.css、
           也带着自己的表单逻辑，隔着框子互不干扰，直接访问那个地址
           也还是一张完整的页面。
           本页没有引 style.css，所以这里的颜色全部用上面那套
           --bg / --card / --text / --muted / --border / --accent。 */
        .contact-modal {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* 浮窗底色不走本页的 --card，而是跟站内页面的一致（白 / #0f1115）：
               框里那页是透明底，卡片、输入框用的都是 css/style.css 的变量，
               底色对不上就会出现「卡片比背景还暗」这种反过来的观感 */
            --panel-bg: #ffffff;
            /* 加载骨架的底色：比面板白再深一档，扫光走的是更亮的白。
               底色不能太接近纯白，否则和真卡片分不出来、光带也没有对比度。
               深色模式下这两个反转（见下面），扫光只给一点点白，
               不然在 #0f1115 上会闪出一块刺眼的亮斑 */
            --sk-base: #ececf2;
            --sk-base-strong: #e1e1ea;
            --sk-shine: rgba(255, 255, 255, 1);
        }
        html[data-theme="dark"] .contact-modal {
            --panel-bg: #0f1115;
            --sk-base: #1c212a;
            --sk-base-strong: #262c36;
            --sk-shine: rgba(255, 255, 255, 0.07);
        }
        /* display 会盖掉 [hidden] 的默认样式，必须显式收回来 */
        .contact-modal[hidden] { display: none; }

        .contact-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(24, 24, 22, 0.44);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            animation: contactFade .24s ease both;
        }

        .contact-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            width: min(880px, 100%);
            /* 高度按内容走（框里那页把自身高度 postMessage 过来），
               上限才是 780 / 视口。写死高度的话内容一少就剩一大块空白 */
            max-height: min(780px, 100%);
            overflow: hidden;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, .26);
            outline: none;
            animation: contactRise .28s cubic-bezier(.32, .72, 0, 1) both;
        }

        .contact-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: none;
            padding: 13px 14px 13px 22px;
            border-bottom: 1px solid var(--border);
        }
        .contact-panel-head h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: .01em;
        }

        /* 关闭按钮用内联 SVG 画叉，不用图标字体：
           这个页面没引 css/style.css，图标字体不在。 */
        .contact-panel-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            width: 32px;
            height: 32px;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: background .2s ease, color .2s ease;
        }
        .contact-panel-close svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
        }
        @media (hover: hover) and (pointer: fine) {
            .contact-panel-close:hover {
                background: rgba(0, 0, 0, .06);
                color: var(--text);
            }
        }
        /* 注意这里不能写成 html [data-theme="dark"] —— 中间空格会变成
           「html 的后代」，而 data-theme 就在 html 自己身上，永远不匹配 */
        @media (hover: hover) and (pointer: fine) {
            html[data-theme="dark"] .contact-panel-close:hover {
                background: rgba(255, 255, 255, .1);
            }
        }
        .contact-panel-close:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .contact-panel-body {
            position: relative;
            flex: 1;
            min-height: 0;
            /* 框里那页会把自己的高度报上来，正常情况下这里不会滚；
               只有「内容高过 max-height」时才由这一层接住多余的滚动，
               免得出现「外层滚一点、内层滚一点」的双滚动条。
               overflow-x 显式收成 hidden：只写 overflow-y 会让 x 轴也变成 auto，
               里面但凡多出 1px 宽度，底部就会冒一条横向滚动条 */
            overflow-x: hidden;
            overflow-y: auto;
        }

        .contact-frame {
            display: block;
            width: 100%;
            /* 真实高度由 iframe 里那页 postMessage 上来，这个值只是量到之前的占位。
               它跟着上面的骨架高度走（桌面两列 272、窄屏单列 450），
               加载完换成真实高度时几乎不跳。
               原来写死 420：两列内容其实只有 283，加载完会突然矮掉一大截。 */
            height: 272px;
            border: 0;
            background: transparent;
            /* 这里刻意不做淡入：iframe 上的 opacity 动画一旦卡在起始帧
               （reduced-motion、合成器掉帧、某些内嵌浏览器都见过），
               整个框就是一片空白。用 visibility 一步切到位，不出意外。 */
            visibility: hidden;
        }
        .contact-frame.is-ready { visibility: visible; }

        /* ==================== 加载骨架 ====================
           等 iframe 的那几百毫秒里铺一层骨架，形状对齐 contact.html 的真实内容：
           两列四张卡 + 底部两行说明。下面这些数值是照那边抄过来的，
           **改那页的布局时这里要跟着改**，否则加载完会跳一下：
             卡片 padding 16px 18px、圆角 14px、高 77px；图标圈 38px
             两组之间、组内卡片之间都是 gap: 12px
             网格 minmax(min(300px,100%), 1fr)；页面 max-width 720px、padding 24px 0 30px
           卡片内部只画「圆形图标 + 两行文字条」，光带扫过去时最像真内容。
           不用转圈了：骨架本身就是「内容正在长出来」的信号。 */
        .contact-loading {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .contact-loading[hidden] { display: none; }

        /* 只说给读屏听，屏幕上不占地方（骨架对读屏没有意义） */
        .contact-sk-sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }
        .contact-sk-page {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 0 30px;
        }
        .contact-sk-channels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
            gap: 12px;
            align-items: start;
        }
        .contact-sk-group {
            display: grid;
            gap: 12px;
            min-width: 0;
        }
        .contact-sk-card {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 14px;
            height: 77px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--sk-base);
        }
        .contact-sk-avatar {
            flex: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--sk-base-strong);
        }
        .contact-sk-lines {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .contact-sk-bar {
            display: block;
            height: 10px;
            border-radius: 5px;
            background: var(--sk-base-strong);
        }
        .contact-sk-bar-sm { width: 34px; }
        .contact-sk-bar-lg { width: 104px; }
        .contact-sk-note {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 16px 2px 0;
        }
        .contact-sk-note .contact-sk-bar { height: 13px; }

        /* 光带扫在卡片这一层，一次盖过里面的圆形和文字条，
           看起来是「整张卡在动」，而不是几个零件各自闪。
           1.4s 一轮：浮窗通常 0.7s 左右就位，太快像闪烁，太慢则一次都看不到。 */
        .contact-sk-card::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent 0%, var(--sk-shine) 50%, transparent 100%);
            animation: contactSkeletonSweep 1.4s ease-in-out infinite;
        }
        @keyframes contactSkeletonSweep {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        /* 关闭是「加一个类」，用 @keyframes 而不是 transition：
           同一帧里两次样式变更会被合并，transition 会被整条跳过 */
        .contact-modal.is-closing .contact-backdrop { animation: contactFadeOut .2s ease both; }
        .contact-modal.is-closing .contact-panel { animation: contactFall .2s ease both; }

        @keyframes contactFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes contactFadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes contactRise {
            from { opacity: 0; transform: translateY(14px) scale(.985); }
            to { opacity: 1; transform: none; }
        }
        @keyframes contactFall {
            from { opacity: 1; transform: none; }
            to { opacity: 0; transform: translateY(10px) scale(.99); }
        }

        /* 浮窗打开时背后不许滚 */
        body.is-contact-open { overflow: hidden; }

        @media (max-width: 640px) {
            /* 窄屏不再铺满屏幕：内容只有两张卡片，铺满会剩一大片空白。
               留一圈边距做成一浮起的卡片，高过视口时 max-height 会兜住。 */
            .contact-modal { padding: 12px; }
            .contact-panel { width: 100%; }
            .contact-panel-head { padding: 11px 11px 11px 18px; }
            /* 单列时四张卡竖着排，骨架和占位都要高得多 */
            .contact-frame { height: 450px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .contact-backdrop,
            .contact-panel,
            .contact-modal.is-closing .contact-backdrop,
            .contact-modal.is-closing .contact-panel { animation: none; }
            /* 骨架留着（它表达「还在加载」），只是别扫了 */
            .contact-sk-card::after { animation: none; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="code">404</p>
        <h1>Not Found</h1>
        <p>链接可能拼错了，或内容不存在。<br></p>
        <div class="actions">
            <a class="btn primary" href="/">回到首页</a>
            <!-- 有 JS 时点它是开浮窗（href 被 preventDefault 拦下）；
                 没 JS 就老老实实跳到那一页。href 必须是站点根路径：
                 这个 404 可能是在 /foo/bar 上被兜出来的，相对地址会解析错。 -->
            <a class="btn" href="/project_subpage/blog/contact.html" id="contactOpen"
               aria-haspopup="dialog">获取联系</a>
        </div>
    </div>

    <!-- ==================== 「获取联系」浮窗 ====================
         里面的 contact.html 走 ?embedded=1：去掉页头大标题、铺透明底，
         看起来像是这个框子自带的内容。iframe 首次打开时才插入，
         免得 404 页什么都没干就先把那页的样式表拉一遍。 -->
    <div class="contact-modal" id="contactModal" hidden>
        <div class="contact-backdrop" data-contact-close></div>
        <div class="contact-panel" role="dialog" aria-modal="true"
             aria-labelledby="contactModalTitle" tabindex="-1">
            <div class="contact-panel-head">
                <h2 id="contactModalTitle">获取联系</h2>
                <button class="contact-panel-close" id="contactModalClose" type="button" aria-label="关闭">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6 L18 18 M18 6 L6 18"></path>
                    </svg>
                </button>
            </div>
            <div class="contact-panel-body" id="contactPanelBody">
                <!-- 加载骨架：形状照 contact.html 的两列四卡 + 说明排的。
                     iframe 一到就把整块 [hidden] 掉（JS 那边还是按 id 找它，没变）。 -->
                <div class="contact-loading" id="contactLoading" role="status">
                    <span class="contact-sk-sr">正在打开获取联系</span>
                    <div class="contact-sk-page" aria-hidden="true">
                        <div class="contact-sk-channels">
                            <div class="contact-sk-group">
                                <div class="contact-sk-card">
                                    <span class="contact-sk-avatar"></span>
                                    <span class="contact-sk-lines">
                                        <span class="contact-sk-bar contact-sk-bar-sm"></span>
                                        <span class="contact-sk-bar contact-sk-bar-lg"></span>
                                    </span>
                                </div>
                                <div class="contact-sk-card">
                                    <span class="contact-sk-avatar"></span>
                                    <span class="contact-sk-lines">
                                        <span class="contact-sk-bar contact-sk-bar-sm"></span>
                                        <span class="contact-sk-bar contact-sk-bar-lg"></span>
                                    </span>
                                </div>
                            </div>
                            <div class="contact-sk-group">
                                <div class="contact-sk-card">
                                    <span class="contact-sk-avatar"></span>
                                    <span class="contact-sk-lines">
                                        <span class="contact-sk-bar contact-sk-bar-sm"></span>
                                        <span class="contact-sk-bar contact-sk-bar-lg"></span>
                                    </span>
                                </div>
                                <div class="contact-sk-card">
                                    <span class="contact-sk-avatar"></span>
                                    <span class="contact-sk-lines">
                                        <span class="contact-sk-bar contact-sk-bar-sm"></span>
                                        <span class="contact-sk-bar contact-sk-bar-lg"></span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="contact-sk-note">
                            <span class="contact-sk-bar" style="width: 78%"></span>
                            <span class="contact-sk-bar" style="width: 42%"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var trigger = document.getElementById('contactOpen');
            var modal = document.getElementById('contactModal');
            if (!trigger || !modal) return;

            var panel = modal.querySelector('.contact-panel');
            var closeBtn = document.getElementById('contactModalClose');
            var bodyBox = document.getElementById('contactPanelBody');
            var loading = document.getElementById('contactLoading');

            /* 404.html 是被 GitHub Pages 兜到任意路径上渲染的，
               相对地址会跟着那个假路径走，所以统一用站点根路径；
               只有本地 file:// 预览才退回相对地址。 */
            var CONTACT_PATH = 'project_subpage/blog/contact.html';
            var ROOT = window.location.protocol === 'file:' ? '' : '/';

            /* ---------------- 趁用户还在看这页，先把「获取联系」预热进缓存 ----------------
               contact.html 是点击那一刻才插进 iframe 的，所以第一次打开是彻底的
               冷启动。这页自己没有任何外部依赖（样式全在 <style> 里），load 来得
               极快，正好拿这段时间把「点开要用到的那几个文件」先抓一遍。

               实测（本地把每个响应延迟 200ms 模拟跨境 RTT）：
                 不预热 → iframe load 447ms，子资源各 213ms
                 预热后 → iframe load 234ms，子资源各 5ms
               ⚠️ 只有「子资源」能命中。iframe 的 HTML 文档那一次请求复用不了预热
               结果，prefetch、prefetch+as="document"、fetch() 三种都试过，一样。
               所以别指望点击后是 0 等待，仍会有一次文档请求走网络。

               两个容易漏的点：
               1. prefetch 不递归。contact.html 引的样式表和脚本必须逐个列出来，
                  少一个就多一次跨境往返。
               2. icons.css 这一页用不到（图标已改成内联 SVG），但它挂在
                  style.css 首行的 @import 上，是无条件请求的，所以照样要预热。
               缓存时长跟 GitHub Pages 的 max-age=600 走：十分钟内点开就是命中。
               代价是没点的人也会多下这 80 KB —— 只为 404 页做，可以接受；
               浏览器开了省流量模式就不预取。 */
            var PREFETCH = [
                CONTACT_PATH + '?embedded=1',
                'css/style.css',
                'fonts/icons.css',
                'js/copyToClipboard.js'
            ];

            function prefetchContact() {
                if (navigator.connection && navigator.connection.saveData) return;
                for (var i = 0; i < PREFETCH.length; i++) {
                    var pre = document.createElement('link');
                    pre.rel = 'prefetch';
                    pre.href = ROOT + PREFETCH[i];
                    document.head.appendChild(pre);
                }
            }

            if (document.readyState === 'complete') prefetchContact();
            else window.addEventListener('load', prefetchContact);

            var frame = null;
            var isOpen = false;
            var pushedState = false;
            var lastFocus = null;

            trigger.setAttribute('href', ROOT + CONTACT_PATH);

            function mountFrame() {
                if (frame) return;
                frame = document.createElement('iframe');
                frame.className = 'contact-frame';
                frame.title = '获取联系';
                frame.src = ROOT + CONTACT_PATH + '?embedded=1';
                frame.addEventListener('load', function () {
                    /* 骨架和 iframe 必须同一帧切换：先撤骨架、60ms 后再露 iframe
                       的话，中间就是一段白屏（以前转圈时代不明显，换成整块骨架就很容易看出来）。
                       这 60ms 是等框里把高度 postMessage 上来，避免按占位高度先闪一下；
                       占位高度现在和真实高度只差十几像素，主要是防极端布局。 */
                    window.setTimeout(function () {
                        loading.hidden = true;
                        frame.classList.add('is-ready');
                    }, 60);
                    /* 把当前主题推给框里的页面，免得深浅色对不上 */
                    try {
                        frame.contentWindow.postMessage({
                            type: 'annie-theme',
                            theme: document.documentElement.getAttribute('data-theme')
                        }, '*');
                    } catch (e) {}
                });
                bodyBox.appendChild(frame);
            }

            /* 框里那页把自己有多高报上来，外面按这个高度收框。
               上限由 .contact-panel 的 max-height 管，这里只挡掉离谱的值 */
            window.addEventListener('message', function (event) {
                var data = event.data;
                if (!data || data.type !== 'annie-contact-height' || !frame) return;
                var height = parseInt(data.height, 10);
                if (!height || height < 0) return;
                frame.style.height = Math.min(height, 1200) + 'px';
            });

            function focusables() {
                var nodes = panel.querySelectorAll('button, iframe, a[href], input, textarea, select, [tabindex]:not([tabindex="-1"])');
                return Array.prototype.filter.call(nodes, function (el) {
                    return !el.disabled && el.offsetParent !== null;
                });
            }

            /* Tab 不许跑到浮窗背后的 404 页上 */
            function onKeydown(event) {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    closeModal();
                    return;
                }
                if (event.key !== 'Tab') return;
                var list = focusables();
                if (!list.length) return;
                var first = list[0];
                var last = list[list.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }

            function openModal() {
                if (isOpen) return;
                isOpen = true;
                lastFocus = document.activeElement;
                mountFrame();
                modal.hidden = false;
                document.body.classList.add('is-contact-open');
                /* 撑一条历史记录：手机按返回键先关浮窗，而不是直接离开 404 页 */
                try {
                    window.history.pushState({ contactModal: true }, '');
                    pushedState = true;
                } catch (e) {
                    pushedState = false;
                }
                closeBtn.focus({ preventScroll: true });
                document.addEventListener('keydown', onKeydown, true);
            }

            function closeModal(fromPopState) {
                if (!isOpen) return;
                isOpen = false;
                document.removeEventListener('keydown', onKeydown, true);
                document.body.classList.remove('is-contact-open');

                var needBack = pushedState && !fromPopState;
                pushedState = false;

                modal.classList.add('is-closing');
                window.setTimeout(function () {
                    modal.classList.remove('is-closing');
                    modal.hidden = true;
                }, 220);

                if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
                lastFocus = null;

                /* 关闭按钮走的是 history.back()，随后 popstate 会再进来一次，
                   那时 isOpen 已经是 false，直接 return，不会重复关 */
                if (needBack) window.history.back();
            }

            trigger.addEventListener('click', function (event) {
                /* 用修饰键点、或者中键：交还给浏览器，让它照常开新标签 */
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
                event.preventDefault();
                openModal();
            });

            closeBtn.addEventListener('click', function () { closeModal(); });

            modal.addEventListener('click', function (event) {
                if (event.target.hasAttribute('data-contact-close')) closeModal();
            });

            window.addEventListener('popstate', function () {
                if (isOpen) closeModal(true);
            });
        })();
    </script>
</body>
</html>
