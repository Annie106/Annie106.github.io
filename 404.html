<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie · 页面走丢了</title>
    <meta name="robots" content="noindex">

    <!-- 站点已从 /annie106/ 迁到根目录。
         GitHub Pages 不支持服务端重定向，所以历史链接只能靠这里兜。
         命中 /annie106/xxx 时，把前缀剥掉原地替换，查询串和锚点一起带走。 -->
    <script>
        (function () {
            try {
                var m = window.location.pathname.match(/^\/annie106(\/.*)?$/i);
                if (m) {
                    var rest = m[1] || '/';
                    window.location.replace(rest + window.location.search + window.location.hash);
                    return;
                }
            } catch (e) {}

            /* 反馈页 / 评论区已经并进主页面（?view=feedback / ?view=comments），
               原来 project_subpage/blog/ 下的那两个文件也挪进 /archive/ 归档了。
               旧链接打到这两个路径时直接送去新地址，
               老参数 article / title 顺手改名成 fa+ft（反馈）、ca+ct（评论）。 */
            try {
                var legacy = window.location.pathname.match(/\/project_subpage\/blog\/(feedback|comments)\.html$/i);
                if (legacy) {
                    var view = legacy[1].toLowerCase();
                    var old = new URLSearchParams(window.location.search);
                    var next = new URLSearchParams();
                    next.set('view', view);
                    var legacyArticle = old.get('article');
                    var legacyTitle = old.get('title');
                    if (legacyArticle) next.set(view === 'feedback' ? 'fa' : 'ca', legacyArticle);
                    if (legacyTitle) next.set(view === 'feedback' ? 'ft' : 'ct', legacyTitle);
                    window.location.replace('/index.html?' + next.toString());
                    return;
                }
            } catch (e) {}

            try {
                var t = localStorage.getItem('annie-theme');
                var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : (dark ? 'dark' : 'light'));
            } catch (e) {}
        })();
    </script>

    <style>
        :root {
            --bg: #fbfaf7;
            --card: #ffffff;
            --text: #2c2c2a;
            --muted: #7a7873;
            --border: rgba(44, 44, 42, 0.12);
            --accent: #185fa5;
        }
        [data-theme="dark"] {
            --bg: #16161a;
            --card: #1e1e23;
            --text: #ecebe6;
            --muted: #9a988f;
            --border: rgba(236, 235, 230, 0.14);
            --accent: #85b7eb;
        }
        /* 这个页面没有引 css/style.css，所以那条「点按高亮透明」的全局重置得自己写。
           不写的话，手机点「回到首页 / 联系我」会在圆角按钮外面闪出一块方形的蓝底。 */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 420px; text-align: center; }
        .code {
            font-size: 64px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 2px;
            color: var(--muted);
            opacity: 0.45;
            margin: 0 0 18px;
        }
        h1 { font-size: 19px; font-weight: 500; margin: 0 0 10px; }
        p { font-size: 14px; line-height: 1.75; color: var(--muted); margin: 0 0 26px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        a.btn {
            display: inline-block;
            padding: 9px 20px;
            border-radius: 999px;
            font-size: 14px;
            text-decoration: none;
            border: 1px solid var(--border);
            color: var(--text);
            transition: border-color .2s ease, opacity .2s ease;
        }
        a.btn:hover { border-color: var(--muted); }
        a.btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        [data-theme="dark"] a.btn.primary { color: #10151c; }
        a.btn.primary:hover { opacity: .88; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="code">404</p>
        <h1>这个页面不存在</h1>
        <p>链接可能拼错了，或者内容已经搬家。<br>博客地址现在就是 annie106.github.io。</p>
        <div class="actions">
            <a class="btn primary" href="/">回到首页</a>
            <a class="btn" href="mailto:anniedv106@gmail.com">联系我</a>
        </div>
    </div>
</body>
</html>
